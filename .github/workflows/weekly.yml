# Ejecuta los módulos automáticamente y guarda los reportes como artefactos.
# Configura los secretos en GitHub: Settings → Secrets and variables → Actions.
# Ojo: la base SQLite no persiste entre ejecuciones; para histórico real usa tu Mac o migra a Supabase.
name: Copilot semanal

on:
  schedule:
    - cron: "0 13 * * 1"   # lunes 13:00 UTC: tendencias + auditoría
  workflow_dispatch:
    inputs:
      command:
        description: "Qué módulo ejecutar"
        type: choice
        options: [tendencias, instagram, leads]
        default: tendencias

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMAND: ${{ inputs.command }}
        run: |
          if [ -n "$COMMAND" ]; then
            python main.py "$COMMAND"
          else
            python main.py tendencias
            python main.py instagram
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: reports/
